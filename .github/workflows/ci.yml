name: ci

# Typecheck, test and build only. This repository is the TOOL's source — its
# bounties.yaml is a sample, not a funded program — so there is deliberately no
# job here that can reach Gibwork or spend money. The plan/apply workflow for
# people adopting gibbon in their own repo lives in the README.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
